spring.application.name=stock

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stock}
spring.datasource.username=${DB_USERNAME:stock_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.driver-class-name=org.postgresql.Driver

# External API credentials are supplied through Eclipse Environment variables.
spring.jpa.open-in-view=false
external.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
external.alpha-vantage.connect-timeout=5s
external.alpha-vantage.read-timeout=10s
external.alpha-vantage.daily-limit=25
external.alpha-vantage.failure-cooldown=5m

# Official end-of-day Korean market data; credentials are checked only on API calls.
external.krx.auth-key=${KRX_AUTH_KEY:}
external.krx.lookback-days=14
external.krx.connect-timeout=5s
external.krx.read-timeout=10s
external.opendart.api-key=${OPENDART_API_KEY:}
external.opendart.years=5
external.opendart.report-code=11011
external.opendart.connect-timeout=5s
external.opendart.read-timeout=10s

stock.cache.price-ttl=30m
stock.cache.kr-price-ttl=6h
stock.cache.asset-ttl=24h
stock.cache.dividend-ttl=24h

# Development only; production must restrict refresh to administrators.
stock.development.refresh-enabled=${STOCK_REFRESH_ENABLED:false}
